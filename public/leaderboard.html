<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>المتطوعون — بوزلفة نظيفة</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css?v=2">
  <style>
    .country-hero {
      text-align: center; padding: 20px; background: linear-gradient(135deg,#fef3c7,#fde68a);
      border-radius: var(--radius); margin-bottom: 16px; border: 2px solid #f59e0b;
    }
    .country-hero .big-score { font-size: 3rem; font-weight: 800; color: #92400e; }
    .country-hero .sub { font-size: .85rem; color: #92400e; font-weight: 600; }
    .podium { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .podium-card {
      background: var(--card); border-radius: var(--radius); padding: 16px 12px;
      text-align: center; box-shadow: var(--shadow); flex: 1; max-width: 120px;
    }
    .podium-card .medal { font-size: 2rem; }
    .podium-card .name { font-size: .75rem; font-weight: 700; margin: 4px 0; word-break: break-all; }
    .podium-card .pts { font-size: .8rem; color: var(--orange); font-weight: 800; }
    .podium-1 { transform: scale(1.05); border: 2px solid #f59e0b; }
    .rank-row {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border-radius: 12px; padding: 10px 14px;
      margin-bottom: 6px; box-shadow: var(--shadow);
    }
    .rank-num { font-size: 1rem; font-weight: 800; color: var(--text-light); min-width: 28px; text-align:center; }
    .rank-1 .rank-num { color: #f59e0b; }
    .rank-info { flex: 1; }
    .rank-name { font-weight: 700; font-size: .85rem; }
    .rank-stars { font-size: .8rem; color: var(--orange); }
    .rank-reports { font-size: .7rem; color: var(--text-light); }
    .empty-leader { text-align: center; padding: 40px; color: var(--text-light); }
    .hero-self { border: 2px solid var(--orange); }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <a href="/" class="back-btn">← رجوع</a>
      <img src="/logo.svg" alt="بوزلفة نظيفة" class="small-logo" width="36" height="36">
      <h2>🏆 متطوعو بوزلفة</h2>
    </header>

    <div class="country-hero">
      <div class="sub">🇹🇳 رصيد تونس التنموي</div>
      <div class="big-score" id="totalStars">0</div>
      <div class="sub" id="totalStats">0 بلاغ · 0 منجز</div>
    </div>

    <div class="podium" id="podium"></div>
    <div id="rankList"></div>
  </main>
  <script src="/js/leaderboard.js?v=2"></script>
</body>
</html>
