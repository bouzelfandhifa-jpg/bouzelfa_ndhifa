<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>البلدية — بوزلفة نظيفة</title>
  <link rel="stylesheet" href="/css/style.css?v=2">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    .progress-row { display:flex; align-items:center; gap:8px; margin-top:6px; }
    .progress-slider { flex:1; height:6px; border-radius:3px; -webkit-appearance:none; appearance:none; cursor:pointer; }
    .progress-slider::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:var(--orange); border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.2); }
    .progress-label { font-size:.75rem; font-weight:700; min-width:35px; text-align:center; }
    .stars-earned { font-size:.7rem; color:#854d0e; font-weight:700; }
    .country-score { text-align:center; padding:12px; background:linear-gradient(135deg,#fef3c7,#fde68a); border-radius:var(--radius); margin-bottom:16px; border:2px solid #f59e0b; }
    .country-score .score-number { font-size:2rem; font-weight:800; color:#92400e; }
    .country-score .score-label { font-size:.8rem; color:#92400e; font-weight:600; }
    .hero-badge-link { display:inline-flex; align-items:center; gap:4px; color:var(--orange); font-weight:600; text-decoration:none; font-size:.7rem; }
    .country-header { display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:4px; }
    .country-header .flag { font-size:1.5rem; }
  </style>
</head>
<body>
  <main class="dashboard-page">
    <header class="page-header">
      <a href="/" class="back-btn">← رجوع</a>
      <h2>🏛️ البلدية — البلاغات</h2>
    </header>

    <div class="country-score" id="countryScore">
      <div class="country-header">
        <span class="flag">🇹🇳</span>
        <span class="score-label">رصيد تونس التنموي</span>
      </div>
      <div class="score-number" id="totalStars">0</div>
      <div style="display:flex;gap:12px;justify-content:center;font-size:.75rem;color:#92400e;font-weight:600;margin-top:4px">
        <span id="totalReports">0 بلاغ</span>
        <span id="resolvedReports">0 منجز</span>
      </div>
    </div>

    <div class="stats-bar" id="statsBar">
      <div class="stat pending">⏳ 0</div>
      <div class="stat in-progress">🔄 0</div>
      <div class="stat resolved">✅ 0</div>
    </div>

    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">الكل</button>
      <button class="filter-btn" data-filter="pending">في انتظار</button>
      <button class="filter-btn" data-filter="in_progress">قيد المعالجة</button>
      <button class="filter-btn" data-filter="resolved">منجز</button>
    </div>

    <div id="map" class="dash-map"></div>

    <div class="report-list" id="reportList">
      <p class="loading">جاري التحميل...</p>
    </div>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script src="/js/dashboard.js?v=2"></script>
</body>
</html>
