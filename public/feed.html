<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>البلاغات — بوزلفة نظيفة</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css?v=2">
  <style>
    .feed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .feed-card {
      background: var(--card); border-radius: var(--radius); overflow: hidden;
      box-shadow: var(--shadow); position: relative;
      transition: transform .1s; cursor: pointer;
    }
    .feed-card:active { transform: scale(.97); }
    .feed-card.resolved { opacity: .85; }
    .feed-photo { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; }
    .feed-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(0,0,0,.7));
      padding: 30px 10px 10px; color: #fff;
    }
    .feed-status {
      display: inline-block; padding: 2px 10px; border-radius: 10px;
      font-size: .65rem; font-weight: 700; margin-bottom: 4px;
    }
    .feed-status.pending { background: #f59e0b; color: #fff; }
    .feed-status.in_progress { background: #3b82f6; color: #fff; }
    .feed-status.resolved { background: #22c55e; color: #fff; }
    .feed-hero { font-size: .65rem; font-weight: 600; }
    .feed-progress {
      height: 4px; background: rgba(255,255,255,.3); border-radius: 2px;
      margin-top: 6px; overflow: hidden;
    }
    .feed-progress-bar { height: 100%; background: #22c55e; border-radius: 2px; transition: width .3s; }
    .feed-stars { font-size: .6rem; margin-top: 2px; }
    .feed-desc { font-size: .75rem; color: var(--text-light); padding: 8px 10px 10px; }
    .feed-time { font-size: .6rem; color: #999; padding: 0 10px 10px; }
    .empty-feed { grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--text-light); }
    .load-more { width: 100%; padding: 14px; margin-top: 12px; background: var(--orange-light);
      color: var(--orange-dark); border: 2px dashed var(--orange); border-radius: var(--radius);
      font-size: .9rem; font-weight: 700; cursor: pointer; text-align: center; }
    .load-more:disabled { opacity: .5; pointer-events: none; }
    .stats-bar.feed-stats { gap: 6px; }
    .stats-bar.feed-stats .stat { font-size: .75rem; padding: 6px; }
    @media (max-width: 360px) { .feed-grid { grid-template-columns: 1fr; } }

    /* Detail modal */
    .modal-body img { width: 100%; border-radius: 12px; margin-bottom: 12px; }
    .modal-body p { font-size: .9rem; margin-bottom: 6px; text-align: right; }
    .modal-stars { font-size: 1.3rem; letter-spacing: 2px; }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <a href="/" class="back-btn">← رجوع</a>
      <img src="/logo.svg" alt="بوزلفة نظيفة" class="small-logo" width="36" height="36">
      <h2>جميع البلاغات</h2>
    </header>

    <div class="stats-bar feed-stats">
      <div class="stat pending" id="statTotal">📋 0</div>
      <div class="stat in-progress" id="statProgress">🔄 0</div>
      <div class="stat resolved" id="statResolved">✅ 0</div>
      <div class="stat" style="background:#fef9c3;color:#854d0e" id="statStars">⭐ 0</div>
    </div>

    <div class="feed-grid" id="feedGrid"></div>
    <button id="loadMore" class="load-more" hidden>عرض المزيد</button>
  </main>

  <div id="detailModal" class="modal" hidden>
    <div class="modal-content">
      <div class="modal-body" id="detailBody"></div>
      <button class="cta-btn small" onclick="document.getElementById('detailModal').hidden=true">إغلاق</button>
    </div>
  </div>

  <script src="/js/feed.js?v=2"></script>
</body>
</html>
