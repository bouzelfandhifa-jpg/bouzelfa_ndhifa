<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>بلّغ — بوزلفة نظيفة</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="report-page">
    <header class="page-header">
      <a href="/" class="back-btn">← رجوع</a>
      <img src="/logo.svg" alt="بوزلفة نظيفة" class="small-logo" width="36" height="36">
      <h2>بلّغ عن بقعة قذرة</h2>
    </header>

    <div id="heroBadge" class="hero-badge">
      <span class="hero-icon">🦸</span>
      <span>أنت البطل: <strong id="heroIdDisplay">---</strong></span>
    </div>

    <form id="reportForm">
      <div class="photo-section">
        <div id="photoPreview" class="photo-preview">
          <span class="photo-placeholder">📸</span>
        </div>
        <div class="photo-buttons">
          <button type="button" id="cameraBtn" class="btn btn-secondary">📷 التقط صورة</button>
          <button type="button" id="galleryBtn" class="btn btn-secondary">🖼️ اختار صورة</button>
        </div>
        <input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
        <input type="file" id="galleryInput" accept="image/*" hidden>
      </div>

      <div class="field">
        <label for="description">وصف البقعة (اختياري)</label>
        <textarea id="description" rows="3" placeholder="مثلاً: بقعة قذرة بجانب الطريق أمام المحل الفلاني..."></textarea>
      </div>

      <div class="field">
        <label>المكان</label>
        <div id="locationStatus" class="location-status">
          <span>⏳ جارٍ تحديد الموقع...</span>
        </div>
        <div id="map" class="map-container"></div>
        <input type="hidden" id="lat" name="lat">
        <input type="hidden" id="lng" name="lng">
        <input type="hidden" id="address" name="address">
        <button type="button" id="retryLocationBtn" class="btn btn-small">📍 تحديد الموقع مرة أخرى</button>
      </div>

      <button type="submit" id="submitBtn" class="cta-btn" disabled>
        <span id="submitText">أرسل البلاغ</span>
        <span id="submitSpinner" class="spinner" hidden></span>
      </button>
    </form>

    <div id="successModal" class="modal" hidden>
      <div class="modal-content">
        <div class="modal-icon">✅</div>
        <h3>شكراً على بلاغك!</h3>
        <p class="hero-success">🦸 <strong id="heroIdSuccess">---</strong></p>
        <p>رقم المتابعة:</p>
        <p class="report-id" id="reportId">---</p>
        <p class="status-badge pending">في انتظار المعالجة</p>
        <a href="/" class="cta-btn small">بلّغ عن بقعة أخرى</a>
      </div>
    </div>
  </main>

  <script src="/js/report.js"></script>
</body>
</html>
