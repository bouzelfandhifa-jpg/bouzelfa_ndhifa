<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00"/>
      <stop offset="100%" style="stop-color:#E65C00"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d7d46"/>
      <stop offset="100%" style="stop-color:#1b5e20"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB347"/>
      <stop offset="100%" style="stop-color:#FF8C00"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Sun rays background -->
  <circle cx="120" cy="110" r="95" fill="#FFF3E0" opacity="0.5"/>

  <!-- Orange body -->
  <circle cx="120" cy="115" r="62" fill="url(#orangeGrad)" filter="url(#shadow)"/>

  <!-- Orange texture dots -->
  <circle cx="100" cy="95" r="1.5" fill="#E65C00" opacity="0.3"/>
  <circle cx="130" cy="90" r="1.5" fill="#E65C00" opacity="0.3"/>
  <circle cx="115" cy="115" r="1.5" fill="#E65C00" opacity="0.3"/>
  <circle cx="140" cy="110" r="1.5" fill="#E65C00" opacity="0.3"/>
  <circle cx="95" cy="120" r="1.5" fill="#E65C00" opacity="0.3"/>
  <circle cx="125" cy="140" r="1.5" fill="#E65C00" opacity="0.3"/>
  <circle cx="145" cy="130" r="1.5" fill="#E65C00" opacity="0.3"/>
  <circle cx="105" cy="140" r="1.5" fill="#E65C00" opacity="0.3"/>

  <!-- Highlight/shine -->
  <ellipse cx="102" cy="97" rx="18" ry="10" fill="white" opacity="0.2" transform="rotate(-20, 102, 97)"/>

  <!-- Leaf stem -->
  <rect x="117" y="45" width="6" height="17" rx="2" fill="#4CAF50"/>

  <!-- Left leaf -->
  <path d="M120 48 Q95 55 85 75 Q98 58 120 48Z" fill="url(#leafGrad)"/>

  <!-- Right leaf -->
  <path d="M120 48 Q140 42 155 55 Q145 40 120 48Z" fill="url(#leafGrad)"/>

  <!-- Small decorative leaf -->
  <path d="M120 52 Q108 48 100 55 Q110 50 120 52Z" fill="#66BB6A"/>

  <!-- Clean droplet (white, representing cleanliness) -->
  <path d="M160 100 Q160 90 165 85 Q170 90 170 100 Q170 108 165 112 Q160 108 160 100Z" fill="white" opacity="0.9" filter="url(#shadow)"/>
  <circle cx="165" cy="97" r="2" fill="#E0F7FA" opacity="0.6"/>

  <!-- Checkmark inside droplet -->
  <path d="M160 100 L163 103 L169 96" fill="none" stroke="#2d7d46" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Arabic text -->
  <text x="120" y="200" text-anchor="middle" font-family="'Noto Naskh Arabic', 'Traditional Arabic', 'Arabic Typesetting', serif" font-size="18" font-weight="700" fill="#2d7d46">بوزلفة نظيفة</text>

  <!-- Subtitle -->
  <text x="120" y="220" text-anchor="middle" font-family="'Noto Naskh Arabic', 'Traditional Arabic', 'Arabic Typesetting', serif" font-size="10" fill="#f57c00" font-weight="600">عاصمة البرتقال</text>
</svg>
