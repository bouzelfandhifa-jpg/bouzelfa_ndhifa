<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>بوزلفة نظيفة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0faf0; color: #1a1a1a; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      text-align: center; padding: 20px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 40px 24px;
      max-width: 400px; width: 100%; box-shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    .logo { width: 120px; height: 120px; margin-bottom: 16px; }
    h1 { color: #2d7d46; font-size: 1.5rem; margin-bottom: 8px; }
    p { color: #555; font-size: 1rem; line-height: 1.6; margin-bottom: 16px; }
    .spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 4px solid #e8f5e9; border-top-color: #2d7d46;
      border-radius: 50%; animation: spin .8s linear infinite; margin: 16px 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .btn {
      display: inline-block; padding: 14px 28px; font-size: 1.1rem; font-weight: 700;
      background: linear-gradient(135deg, #f57c00, #e65100); color: #fff;
      border: none; border-radius: 16px; cursor: pointer; text-decoration: none;
      box-shadow: 0 4px 14px rgba(245,124,0,.35);
    }
    .btn:hover { opacity: .9; }
    .url-display { font-size: .75rem; color: #999; word-break: break-all; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <circle cx="100" cy="100" r="95" fill="#2d7d46" stroke="#1b5e20" stroke-width="6"/>
      <path d="M100 30 L170 120 L130 120 L130 170 L70 170 L70 120 L30 120 Z" fill="#e8f5e9" opacity=".9"/>
      <path d="M100 50 L145 110 L115 110 L115 160 L85 160 L85 110 L55 110 Z" fill="#f57c00"/>
    </svg>
    <h1>بوزلفة نظيفة</h1>
    <p>بلّغ عن بقعة تحتاج عناية في وقتها</p>
    <div class="spinner"></div>
    <p>جاري التوجيه إلى المنصة...</p>
    <a id="directLink" href="#" class="btn">انتقل إلى المنصة</a>
    <p class="url-display" id="urlDisplay"></p>
  </div>
  <script>
    var TUNNEL_URL = "https://combination-orange-confirmed-tracking.trycloudflare.com";
    document.getElementById('directLink').href = TUNNEL_URL;
    document.getElementById('urlDisplay').textContent = TUNNEL_URL;
    setTimeout(function() { window.location.href = TUNNEL_URL; }, 1500);
  </script>
</body>
</html>
